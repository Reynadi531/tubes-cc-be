# Secret Template for Yuki Agent
# DO NOT commit this file with real values. Use it as a reference.
#
# To create the secret in cluster:
#   kubectl create secret generic yuki-secrets \
#     --from-literal=GOOGLE_API_KEY=<your-api-key> \
#     --from-literal=FRONTEND_URL=http://localhost:3001 \
#     -n yuki
#
# Or use sealed-secrets/external-secrets for GitOps workflows.
apiVersion: v1
kind: Secret
metadata:
  name: yuki-secrets
  namespace: yuki
  labels:
    app.kubernetes.io/name: yuki
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  GOOGLE_API_KEY: "<your-google-api-key-here>"
  FRONTEND_URL: "http://localhost:3001"
